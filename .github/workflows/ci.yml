name: GuildCloud CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pin npm rather than inheriting whatever the runner image ships. An npm
      # upgrade previously changed how a hoisted peer (fdir -> picomatch) was
      # validated, so `npm ci` failed in CI while succeeding locally against the
      # same lockfile. Pinning makes the lockfile's contract reproducible.
      - run: npm install -g npm@10.9.8
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run check:migrations
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:worker
      - run: npm run test:ui
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pin npm rather than inheriting whatever the runner image ships. An npm
      # upgrade previously changed how a hoisted peer (fdir -> picomatch) was
      # validated, so `npm ci` failed in CI while succeeding locally against the
      # same lockfile. Pinning makes the lockfile's contract reproducible.
      - run: npm install -g npm@10.9.8
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run test:db
      - run: npm run test:intents
      - run: npm run test:worker-boundary

  public-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pin npm rather than inheriting whatever the runner image ships. An npm
      # upgrade previously changed how a hoisted peer (fdir -> picomatch) was
      # validated, so `npm ci` failed in CI while succeeding locally against the
      # same lockfile. Pinning makes the lockfile's contract reproducible.
      - run: npm install -g npm@10.9.8
      - run: node --version && npm --version
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
