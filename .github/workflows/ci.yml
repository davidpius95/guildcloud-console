name: GuildCloud CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Printed so a future lockfile divergence is visible in the log rather
      # than something to reverse-engineer from an npm error.
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run check:migrations
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:worker
      - run: npm run test:ui
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Printed so a future lockfile divergence is visible in the log rather
      # than something to reverse-engineer from an npm error.
      - run: node --version && npm --version
      - run: npm ci
      # First, because it is the broadest: it rebuilds the whole schema from an
      # empty database using only what is committed. If the repository can no
      # longer build its own control plane, the narrower fixture suites below
      # would still pass -- they seed their own tables -- and hide it.
      - run: npm run test:schema:full
      - run: npm run test:db
      - run: npm run test:intents
      - run: npm run test:worker-boundary

  public-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Printed so a future lockfile divergence is visible in the log rather
      # than something to reverse-engineer from an npm error.
      - run: node --version && npm --version
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
